<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Localities - </title><meta name="description" content="Bengaluru house price predictor trained on 13,000+ real listings."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><main><div class="wrap pg"><div class="eyebrow fade">Every locality</div><h1 class="serif" style="margin-top:14px"><span class="ln"><span>Know your</span></span><span class="ln"><span><em>neighbourhood</em></span></span></h1>
<section><input type="text" id="q" placeholder="Filter localities..." style="max-width:420px;margin-bottom:18px"><div class="tw"><table><thead><tr><th data-k="name">Locality</th><th data-k="n">Listings</th><th data-k="median_ppsf">₹/sqft</th><th data-k="median_price">Median price</th><th data-k="median_sqft">Median sqft</th></tr></thead><tbody id="tb"></tbody></table></div></section></div></main>
<script>load.then(()=>{let k='n',asc=false,q='';const T=$('#tb');
function r(){const d=STATS.localities_list.filter(l=>l.name.toLowerCase().includes(q)).sort((a,b)=>(a[k]>b[k]?1:-1)*(asc?1:-1));T.innerHTML=d.map(l=>`<tr><td>${l.name}</td><td>${l.n}</td><td>₹${l.median_ppsf.toLocaleString()}</td><td>${fmt(l.median_price)}</td><td>${l.median_sqft}</td></tr>`).join('')}
$$('th').forEach(h=>h.onclick=()=>{asc=k==h.dataset.k?!asc:false;k=h.dataset.k;r()});$('#q').oninput=e=>{q=e.target.value.toLowerCase();r()};r()})</script>
<footer>Trained on the public Kaggle “Bengaluru House Data” set (13,320 listings). Estimates are statistical, not valuations or financial advice. Prices in ₹ lakh (1 Cr = 100 L).</footer>
